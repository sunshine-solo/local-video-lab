name: Feature request / 功能建议
description: 建议一个新功能或改进
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 你遇到的问题
      description: 请描述使用场景，而不只是功能名称。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 期望的方案
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 你考虑过的替代方案

  - type: dropdown
    id: scope
    attributes:
      label: 影响范围
      options:
        - 视频拼接
        - 视频去水印
        - 引擎 / 性能
        - 界面 / 交互
        - 打包 / 发布
        - 其他
    validations:
      required: true

  - type: checkboxes
    id: local
    attributes:
      label: 本地优先
      options:
        - label: 该功能可以完全在本机完成，不需要上传视频或依赖云端服务
          required: true
