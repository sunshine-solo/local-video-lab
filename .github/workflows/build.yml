name: Build & Release

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: FFmpeg smoke test
        run: npm run test:smoke

  build:
    name: Build ${{ matrix.target }}
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            target: mac-x64
            arch: x64
            command: npm run dist:mac:x64
            artifacts: |
              release/*.dmg
              release/*.zip
          - os: macos-15
            target: mac-arm64
            arch: arm64
            command: npm run dist:mac:arm64
            artifacts: |
              release/*.dmg
              release/*.zip
          - os: windows-latest
            target: win-x64
            arch: x64
            command: npm run dist:win
            artifacts: |
              release/*.exe

    env:
      MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
      WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build installer (macOS signed + notarized)
        if: runner.os == 'macOS' && env.MAC_CSC_LINK != ''
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          CSC_NAME: ${{ secrets.MAC_CSC_NAME }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npm run build && npx electron-builder --mac --${{ matrix.arch }} --config electron-builder.signed.yml

      - name: Build installer (macOS unsigned)
        if: runner.os == 'macOS' && env.MAC_CSC_LINK == ''
        run: ${{ matrix.command }}

      - name: Build installer (Windows)
        if: runner.os == 'Windows'
        env:
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: ${{ matrix.command }}

      - name: List artifacts
        shell: bash
        run: ls -lh release

      - uses: actions/upload-artifact@v4
        with:
          name: local-video-lab-${{ matrix.target }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify tag matches package.json version
        run: |
          node -e "const p=require('./package.json'); const tag=(process.env.GITHUB_REF_NAME||'').replace(/^v/,''); if (p.version !== tag) { console.error('Tag ' + process.env.GITHUB_REF_NAME + ' does not match package.json version ' + p.version); process.exit(1) }"

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List downloaded files
        run: ls -lh artifacts

      - uses: softprops/action-gh-release@v2
        with:
          name: Local Video Lab ${{ github.ref_name }}
          body_path: .github/release-notes.md
          files: |
            artifacts/*.dmg
            artifacts/*.zip
            artifacts/*.exe
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
