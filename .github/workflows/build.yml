name: Build & Release

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: FFmpeg smoke test
        run: npm run test:smoke

  build:
    name: Build ${{ matrix.target }}
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            target: mac-x64
            command: npm run dist:mac:x64
            artifacts: |
              release/*.dmg
              release/*.zip
          - os: macos-15
            target: mac-arm64
            command: npm run dist:mac:arm64
            artifacts: |
              release/*.dmg
              release/*.zip
          - os: windows-latest
            target: win-x64
            command: npm run dist:win
            artifacts: |
              release/*.exe

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build installer
        run: ${{ matrix.command }}

      - name: List artifacts
        shell: bash
        run: ls -lh release

      - uses: actions/upload-artifact@v4
        with:
          name: local-video-lab-${{ matrix.target }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List downloaded files
        run: ls -lh artifacts

      - uses: softprops/action-gh-release@v2
        with:
          name: Local Video Lab ${{ github.ref_name }}
          body_path: .github/release-notes.md
          files: |
            artifacts/*.dmg
            artifacts/*.zip
            artifacts/*.exe
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
