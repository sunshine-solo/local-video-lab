# 已签名 / 公证的 macOS 构建配置。
# 仅在设置了对应证书与 Apple 账号 secret 时由 CI 使用。
# 用法：electron-builder --mac --arm64 --config electron-builder.signed.yml

extends: ./electron-builder.yml

mac:
  # 空字符串表示不使用固定的 qualifier，让 electron-builder 读取 CSC_NAME 环境变量。
  identity: ""
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  notarize: true
